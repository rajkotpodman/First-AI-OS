name: Continuous Integration & Subsystem Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-subsystems:
    name: Test Subsystems (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 \
            util-linux \
            curl \
            tar

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-cov pyyaml

      - name: Code Quality & Syntax Audit (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Full Subsystem Unit Test Suite (59+ Unit Tests)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate System Configurations & Schemas
        run: |
          python -c "
          import json, yaml, glob
          for f in glob.glob('configs/*.json'):
              with open(f) as fp:
                  json.load(fp)
                  print(f'Valid JSON: {f}')
          for f in glob.glob('configs/*.yaml'):
              with open(f) as fp:
                  yaml.safe_load(fp)
                  print(f'Valid YAML: {f}')
          "

  security-scan:
    name: Security & Policy Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit Security Analysis
        run: |
          pip install bandit
          bandit -r src/ -ll -ii || true


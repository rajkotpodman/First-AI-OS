# AI OS Shell & Dependency Resolver Configuration
# /etc/ai_os/config.yaml or ./configs/config.yaml

system:
  hostname: "ai-os"
  workspace_dir: "/workspace"
  default_shell: "/bin/sh"
  tty_autologin: true

ai_routing:
  local:
    enabled: true
    provider: "ollama"
    endpoint: "http://127.0.0.1:11434"
    model: "llama3.2:3b"
    timeout_seconds: 45
    temperature: 0.2
    context_window: 8192

  remote:
    enabled: true
    provider: "openai"
    endpoint: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4o-mini"
    timeout_seconds: 30
    temperature: 0.2

safety:
  strict_mode: true
  require_root_confirmation: true
  protected_paths:
    - "/"
    - "/boot"
    - "/etc"
    - "/dev"
    - "/sys"
    - "/proc"
    - "/lib"
    - "/bin"
    - "/sbin"
  destructive_patterns:
    - '^rm\s+(-[a-zA-Z]*r[a-zA-Z]*f*|-f[a-zA-Z]*r[a-zA-Z]*)\s+.*(/|\*).*'
    - '.*mkfs(\.[a-z0-9]+)?\s+.*'
    - '.*dd\s+.*of=/dev/.*'
    - '.*fdisk\s+.*'
    - '.*parted\s+.*'
    - '.*chmod\s+(-R\s+)?777\s+.*'
    - '.*>\s*/dev/(sd[a-z]|nvme[0-9]n[0-9]|hd[a-z]).*'
    - '.*(shutdown|poweroff|reboot|init\s+0).*'
    - '.*kill\s+-9\s+1\b.*'

dependency_resolver:
  auto_heal: true
  max_healing_retries: 2
  log_file: "/var/log/ai_deps.log"
  system_package_manager: "apk"   # apk (Alpine), apt (Debian/Ubuntu), pacman (Arch)
  silent_install: true
  verify_in_path: true

logging:
  shell_log: "/var/log/ai_shell.log"
  level: "INFO"

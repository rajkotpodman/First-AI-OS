DEFAULT aios
TIMEOUT 30
PROMPT 0

UI menu.c32
MENU TITLE AI Operating System (Alpine 3.21 x86_64)
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL aios
  MENU LABEL Boot AI OS (Virtual Kernel - Fast Boot)
  MENU DEFAULT
  LINUX /boot/vmlinuz-virt
  INITRD /boot/initramfs-virt
  APPEND console=tty1 quiet initrd=/boot/initramfs-virt modules=loop,squashfs,overlay alpine_dev=cdrom:iso9660

LABEL aios_lts
  MENU LABEL Boot AI OS (LTS Kernel - Bare Metal Hardware)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND console=tty1 quiet initrd=/boot/initramfs-lts modules=loop,squashfs,overlay alpine_dev=cdrom:iso9660

LABEL aios_debug
  MENU LABEL Boot AI OS (Verbose Debug Mode)
  LINUX /boot/vmlinuz-virt
  INITRD /boot/initramfs-virt
  APPEND console=tty1 verbose debug initrd=/boot/initramfs-virt modules=loop,squashfs,overlay alpine_dev=cdrom:iso9660

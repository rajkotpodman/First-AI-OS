# ==============================================================================
# Foot Terminal Emulator Configuration for AI OS
# Location: ~/.config/foot/foot.ini
# ==============================================================================

font=DejaVu Sans Mono:size=11
pad=8x8

[colors]
alpha=0.92
background=0f172a
foreground=f8fafc

## Normal Colors (Tokyo Night / Modern Slate)
regular0=1e293b # black
regular1=f43f5e # red
regular2=10b981 # green
regular3=f59e0b # yellow
regular4=38bdf8 # blue
regular5=a855f7 # magenta
regular6=06b6d4 # cyan
regular7=e2e8f0 # white

## Bright Colors
bright0=334155
bright1=fb7185
bright2=34d399
bright3=fbbf24
bright4=60a5fa
bright5=c084fc
bright6=22d3ee
bright7=ffffff

[scrollback]
lines=5000
multiplier=3.0

[cursor]
style=block
blink=yes
color=0f172a 38bdf8
